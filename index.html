/* =====================================================
LOAD DATABASE
===================================================== */

async function loadDB(){

    try{

        const snapshot =
            await get(
                ref(database, "maintenanceDB")
            );


        if(snapshot.exists()){

            const data =
                snapshot.val();


            db = {

                issues:
                    Array.isArray(data.issues)
                    ? data.issues
                    : Object.values(
                        data.issues || {}
                    ),

                tasks:
                    Array.isArray(data.tasks)
                    ? data.tasks
                    : Object.values(
                        data.tasks || {}
                    )

            };

        }


        if(!Array.isArray(db.issues))
            db.issues=[];


        if(!Array.isArray(db.tasks))
            db.tasks=[];


        refresh();

        renderPlanner();

    }
    catch(error){

        console.error(
            "Firebase Load Error:",
            error
        );

        alert(
            "Unable to connect to Firebase."
        );

    }

}


/* =====================================================
SAVE DATABASE
===================================================== */

async function saveDB(){

    try{

        await set(
            ref(database, "maintenanceDB"),
            db
        );

        console.error(

            error

}

/* =====================================================
HELPERS
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function todayISO(){

    const d =
        new Date();

    const year =
        d.getFullYear();

    const month =
        String(
            d.getMonth()+1
        ).padStart(2,"0");

    const day =
        String(
            d.getDate()
        ).padStart(2,"0");

    return `${year}-${month}-${day}`;

}


function formatDate(date){

    if(!date)
        return "-";


    return new Date(
        date + "T00:00:00"
    ).toLocaleDateString(
        "en-GB"
    );

}

/* =====================================================
ISSUE ID
===================================================== */

function generateIssueId(){

    let max=0;


    db.issues.forEach(x=>{

        const n =
            parseInt(
                String(x.id)
                .replace(/\D/g,"")
            ) || 0;


        if(n>max)
            max=n;

    });


    return "MNT-" +
        String(max+1)
        .padStart(4,"0");

}

/* =====================================================
RESOLUTION TIME
===================================================== */

function calculateResolutionTime(){

    const start =
        document.getElementById(
            "repairStart"
        ).value;


    const end =
        document.getElementById(
            "repairEnd"
        ).value;


    if(!start || !end){

        document.getElementById(
            "resolutionTime"
        ).value="";

        return;

    }


    const diff =
        new Date(end)
        -
        new Date(start);


    if(diff<0){

        document.getElementById(
            "resolutionTime"
        ).value="";

        return;

    }


    const hours =
        Math.floor(
            diff / 3600000
        );


    const minutes =
        Math.floor(
            (diff % 3600000) /
            60000
        );


    document.getElementById(
        "resolutionTime"
    ).value =
        `${hours}h ${minutes}m`;

}


document
.getElementById("repairStart")
.addEventListener(
    "change",
    calculateResolutionTime
);


document
.getElementById("repairEnd")
.addEventListener(
    "change",
    calculateResolutionTime

async function deleteIssue(id){

    const issue =
        db.issues.find(
            x=>x.id===id
        );


    if(!issue)
        return;


    if(!confirm(
        `Delete ${issue.id} - ${issue.name}?`

    db.issues =
        db.issues.filter(
            x=>x.id!==id

    await saveDB();

/* =====================================================
RENDER ISSUES
===================================================== */

function renderIssues(){

    const search =
        (
            document.getElementById(
                "searchIssue"
            )?.value || ""
        ).toLowerCase();


    const status =
        document.getElementById(
            "filterStatus"
        )?.value || "";


    const branch =
        document.getElementById(
            "filterBranch"
        )?.value || "";


    const issues =
        db.issues
        .filter(x=>{

            const text =
                `${x.id} ${x.name} ${x.branch} ${x.asset}`
                .toLowerCase();


            return(

                text.includes(search)

                &&

                (!status ||
                 x.status===status)

                &&

                (!branch ||
                 x.branch===branch)

            );

        })
        .sort(
            (a,b)=>
            new Date(b.date||0)
            -
            new Date(a.date||0)
        );


    document.getElementById(
        "issuesTable"
    ).innerHTML =

        issues.map(x=>`

            <tr>

                <td>
                    <b>${escapeHTML(x.id)}</b>
                </td>

                <td>
                    ${formatDate(x.date)}
                </td>

                <td>

                    <a
                    href="#"
                    onclick="
                    viewIssue('${x.id}');
                    return false;
                    ">

                    ${escapeHTML(x.name)}

                    </a>

                </td>

                <td>
                    ${escapeHTML(
                        x.branch||"-"
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        x.asset||"-"
                    )}
                </td>

                <td>

                    <span
                    class="status
                    ${String(x.status||"")
                    .replace(" ","")}">

                        ${escapeHTML(
                            x.status||""
                        )}

                    </span>

                </td>

                <td>

                    ${Number(
                        x.cost||0
                    ).toLocaleString()}
                    EGP

                </td>

                <td>

                    <button
                    onclick="
                    editIssue('${x.id}')
                    ">
                    Edit
                    </button>

                    <button
                    class="danger"
                    onclick="
                    deleteIssue('${x.id}')
                    ">
                    Delete
                    </button>

                </td>

            </tr>

        `).join("")

        ||

        `

        <tr>

        <td colspan="8">

        No records found.

        </td>

        </tr>

        `;


    updateBranchFilter();

}


/* =====================================================

function updateBranchFilter(){

    const select =
        document.getElementById(
            "filterBranch"
        );


    const current =
        select.value;


    const branches =
        [
            ...new Set(
                db.issues
                .map(x=>x.branch)
                .filter(Boolean)
            )
        ];


    select.innerHTML =
        `<option value="">
        All Branches
        </option>` +

        branches.map(x=>

            `<option value="${escapeHTML(x)}">
            ${escapeHTML(x)}
            </option>`

        ).join("");


    select.value=current;

}


/* =====================================================
PLANNER
===================================================== */

let plannerDate =
    new Date();


function getWeekStart(date){

    const d =
        new Date(date);


    const day =
        d.getDay();


    const diff =
        day===6
        ?0
        :day+1;


    d.setDate(
        d.getDate()-diff
    );


    d.setHours(
        0,0,0,0
    );


    return d;

}


function getWeekDays(){

    const start =
        getWeekStart(
            plannerDate
        );


    const days=[];


    for(
        let i=0;
        i<7;
        i++
    ){

        const d =
            new Date(start);


        d.setDate(
            start.getDate()+i
        );


        days.push(d);

    }


    return days;

}


function changeWeek(amount){

    plannerDate.setDate(
        plannerDate.getDate()
        +
        amount*7
    );


    renderPlanner();

}


function goCurrentWeek(){

    plannerDate =
        new Date();


    renderPlanner();

}


function renderPlanner(){

    const days =
        getWeekDays();


    const start =
        days[0];


    const end =
        days[6];


    document.getElementById(
        "weekRange"
    ).textContent =
        `${formatDate(
            start.toISOString().slice(0,10)
        )} - ${formatDate(
            end.toISOString().slice(0,10)
        )}`;


    renderTodayTasks();


    document.getElementById(
        "weekGrid"
    ).innerHTML =

        days.map(day=>{

            const date =
                day.toISOString()
                .slice(0,10);


            const tasks =
                db.tasks.filter(
                    x=>x.date===date
                );


            const isToday =
                date===todayISO();


            const names=[

                "Sunday",
                "Monday",
                "Tuesday",
                "Wednesday",
                "Thursday",
                "Friday",
                "Saturday"

            ];


            return `

            <div class="
                day-column
                ${isToday?"today":""}
            ">

                <div class="day-title">

                    <b>
                        ${names[
                            day.getDay()
                        ]}
                    </b>

                    <br>

                    <small>
                        ${formatDate(date)}
                    </small>

                </div>


                ${
                    tasks.length

                    ?

                    tasks
                    .map(taskCard)
                    .join("")

                    :

                    `

                    <div style="
                        text-align:center;
                        color:#999;
                        padding-top:35px
                    ">

                        No tasks

                    </div>

                    `
                }


                <button
                style="
                width:100%;
                margin-top:10px
                "
                onclick="
                quickAddTask('${date}')
                ">

                + Add Task

                </button>

            </div>

            `;

        }).join("");


    renderTaskHistory();

}

    const technician =
        document.getElementById(
            "taskTechnician"
        ).value.trim();


    const name =
        document.getElementById(

    const task={

        id:
            "TASK-"+Date.now(),

        date,

        technician,

        name,

        branch:
            document.getElementById(
                "taskBranch"
            ).value.trim(),

        asset:
            document.getElementById(
                "taskAsset"
            ).value.trim(),

        priority:
            document.getElementById(
                "taskPriority"
            ).value,

            x=>x.id===id
        );


    if(!task)
        return;


    if(!confirm(
        "Mark this task as completed?"
    ))
        return;


    task.status="Done";


    task.completedAt =
        new Date().toISOString();


    await saveDB();


    renderPlanner();

}


/* =====================================================
CANCEL TASK
===================================================== */

async function cancelTask(id){

    const task =
        db.tasks.find(
            x=>x.id===id
        );


    if(!task)
        return;


    if(!confirm(
        "Cancel this task?"
    ))
        return;


    task.status="Cancelled";


    task.cancelledAt =
        new Date().toISOString();


    await saveDB();


    renderPlanner();

}

/* =====================================================
TASK HISTORY
===================================================== */

function renderTaskHistory(){

    const history =
        db.tasks
        .filter(
            x=>
            x.status==="Done"
            ||
            x.status==="Cancelled"
        )
        .sort(
            (a,b)=>
            new Date(
                b.completedAt ||
                b.cancelledAt ||
                b.createdAt
            )
            -
            new Date(
                a.completedAt ||
                a.cancelledAt ||
                a.createdAt
            )
        );


    const container =
        document.getElementById(
            "taskHistory"
        );


    if(!history.length){

        container.innerHTML =
            "No completed or cancelled tasks.";

        return;

    }


    container.innerHTML =
        history
        .slice(0,30)
        .map(task=>`

            <div class="history-item">

                <b>
                    ${escapeHTML(
                        task.name
                    )}
                </b>

                <br>

                Date:
                ${formatDate(task.date)}

                <br>

                Technician:
                ${escapeHTML(
                    task.technician
                )}

                <br>

                Status:
                <b>
                    ${escapeHTML(
                        task.status
                    )}
                </b>

            </div>

        `)
        .join("");

}


/* =====================================================
REPORT FILTERS
===================================================== */

function prepareReportFilters(){

    const problem =
        document.getElementById(
            "reportProblem"
        );


    const branch =
        document.getElementById(
            "reportBranch"
        );


    const currentProblem =
        problem.value;


    const currentBranch =
        branch.value;


    const problems =
        [
            ...new Set(
                db.issues
                .map(x=>x.name)
                .filter(Boolean)
            )
        ]
        .sort();


    const branches =
        [
            ...new Set(
                db.issues
                .map(x=>x.branch)
                .filter(Boolean)
            )
        ]
        .sort();


    problem.innerHTML =
        `<option value="">
        Select Problem
        </option>` +

        problems.map(x=>
            `<option value="${escapeHTML(x)}">
            ${escapeHTML(x)}
            </option>`
        ).join("");


    branch.innerHTML =
        `<option value="">
        Select Branch
        </option>` +

        branches.map(x=>
            `<option value="${escapeHTML(x)}">
            ${escapeHTML(x)}
            </option>`
        ).join("");


    problem.value =
        currentProblem;


    branch.value =
        currentBranch;


    const month =
        document.getElementById(
            "reportMonth"
        );


    if(!month.value){

        month.value =
            new Date()
            .toISOString()
            .slice(0,7);

    }

}


/* =====================================================
PROBLEM REPORT
===================================================== */

function renderProblemReport(){

    const problem =
        document.getElementById(
            "reportProblem"
        ).value;


    const branch =
        document.getElementById(
            "reportBranch"
        ).value;


    const month =
        document.getElementById(
            "reportMonth"
        ).value;


    const container =
        document.getElementById(
            "problemReport"
        );


    if(
        !problem ||
        !branch ||
        !month
    ){

        container.innerHTML=`

            <div
            class="section"
            style="
            background:#f9fafb
            ">

                Select Problem + Branch + Month
                to generate the report.

            </div>

        `;

        return;

    }


    const records =
        db.issues
        .filter(x=>

            x.name
            .trim()
            .toLowerCase()
            ===
            problem
            .trim()
            .toLowerCase()

            &&

            x.branch
            .trim()
            .toLowerCase()
            ===
            branch
            .trim()
            .toLowerCase()

            &&

            x.date &&
            x.date.startsWith(month)

        )
        .sort(
            (a,b)=>
            new Date(a.date)
            -
            new Date(b.date)
        );


    const totalCost =
        records.reduce(
            (sum,x)=>
            sum+Number(x.cost||0),
            0
        );


    const resolved =
        records.filter(
            x=>x.status==="Closed"
        ).length;


    const open =
        records.filter(
            x=>x.status!=="Closed"
        ).length;


    container.innerHTML=`

        <div>

            <h2>
                ${escapeHTML(problem)}
            </h2>

            <p>
                <b>Branch:</b>
                ${escapeHTML(branch)}
            </p>

            <p>
                <b>Month:</b>
                ${month}
            </p>

        </div>


        <div class="report-summary">

            <div class="report-box">

                Occurrences

                <strong>
                    ${records.length}
                </strong>

            </div>


            <div class="report-box">

                Resolved

                <strong>
                    ${resolved}
                </strong>

            </div>


            <div class="report-box">

                Pending

                <strong>
                    ${open}
                </strong>

            </div>


            <div class="report-box">

                Monthly Cost

                <strong>
                    ${totalCost.toLocaleString()}
                    EGP
                </strong>

            </div>

        </div>


        <div class="section">

            <h3>
                Complete Problem History
            </h3>


            ${
                records.length

                ?

                `

                <table>

                <thead>

                <tr>

                    <th>#</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th>Description</th>
                    <th>Cause</th>
                    <th>Solution</th>
                    <th>Cost</th>

                </tr>

                </thead>


                <tbody>

                ${
                    records.map(
                        (x,i)=>`

                        <tr>

                            <td>
                                ${i+1}
                            </td>

                            <td>
                                ${formatDate(
                                    x.date
                                )}
                            </td>

                            <td>

                                <span
                                class="
                                status
                                ${String(
                                    x.status||""
                                ).replace(" ","")}
                                ">

                                ${escapeHTML(
                                    x.status||""
                                )}

                                </span>

                            </td>

                            <td>
                                ${escapeHTML(
                                    x.description||"-"
                                )}
                            </td>

                            <td>
                                ${escapeHTML(
                                    x.cause||"-"
                                )}
                            </td>

                            <td>
                                ${escapeHTML(
                                    x.action||"-"
                                )}
                            </td>

                            <td>
                                ${Number(
                                    x.cost||0
                                ).toLocaleString()}
                                EGP
                            </td>

                        </tr>

                        `
                    ).join("")
                }

                </tbody>

                </table>

                `

                :

                `

                <div style="
                    padding:25px;
                    text-align:center;
                    color:#777
                ">

                    No records found
                    for this problem,
                    branch and month.

                </div>

                `

            }

        </div>


        <div
        class="section"
        style="
        background:#111827;
        color:#fff
        ">

            <h3>
                Monthly Maintenance Cost
            </h3>

            <div style="
            font-size:30px;
            font-weight:bold
            ">

                ${totalCost.toLocaleString()}
                EGP

            </div>

            <p>

                ${records.length}
                occurrence(s)
                for this problem at
                ${escapeHTML(branch)}
                during ${month}.

            </p>

        </div>

    `;

}


/* =====================================================
EXPORT
===================================================== */

function exportIssues(){

    if(!db.issues.length){

        alert(
            "No maintenance records."
        );

        return;

    }


    const headers=[

        "Issue ID",
        "Date",
        "Problem",
        "Branch",
        "Equipment",
        "Status",
        "Priority",
        "Cost",
        "Technician",
        "Description",
        "Cause",
        "Solution",
        "Timeline",
        "Resolution Time",
        "Notes"

    ];


    const rows =
        db.issues.map(x=>[

            x.id,
            x.date,
            x.name,
            x.branch,
            x.asset,
            x.status,
            x.priority,
            x.cost,
            x.technician,
            x.description,
            x.cause,
            x.action,
            x.timeline,
            x.resolutionTime,
            x.notes

        ].map(v=>

            `"${String(v??"")
            .replace(/"/g,'""')
            .replace(/\r?\n/g," ")}"`

        ).join(","));


    const csv =
        "\uFEFF"+
        headers.join(",")+
        "\r\n"+
        rows.join("\r\n");


    const blob =
        new Blob(
            [csv],
            {
                type:
                "text/csv;charset=utf-8;"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");


    a.href=url;


    a.download =
        "Maintenance_Report.csv";


    document.body.appendChild(a);


    a.click();


    document.body.removeChild(a);


    URL.revokeObjectURL(url);

}


/* =====================================================
DASHBOARD
===================================================== */

function refresh(){

    renderIssues();


    const open =
        db.issues.filter(
            x=>x.status==="Open"
        ).length;


    const progress =
        db.issues.filter(
            x=>x.status==="In Progress"
        ).length;


    const month =
        new Date()
        .toISOString()
        .slice(0,7);


    const closed =
        db.issues.filter(x=>

            x.status==="Closed"

            &&

            x.date &&
            x.date.startsWith(month)

        ).length;


    const cost =
        db.issues
        .filter(x=>

            x.date &&
            x.date.startsWith(month)

        )
        .reduce(
            (sum,x)=>
            sum+Number(x.cost||0),
            0
        );


    document.getElementById(
        "dOpen"
    ).textContent=open;


    document.getElementById(
        "dProgress"
    ).textContent=progress;


    document.getElementById(
        "dClosed"
    ).textContent=closed;


    document.getElementById(
        "dCost"
    ).textContent=
        cost.toLocaleString()+
        " EGP";


    document.getElementById(
        "todayLabel"
    ).textContent=
        new Date()
        .toLocaleDateString(
            "en-GB"
        );

}
